name: DFD Studio - CI e releases

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Nova tag (v0.0.1), vazio = build sem release'
        required: false
        type: string

permissions:
  contents: write

env:
  PACKAGE_LABEL: ${{ github.ref_type == 'tag' && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.tag || format('ci-{0}', github.run_number)) }}
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.tag || '') }}

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar arquivos e regras de negocio
        run: |
          python -m compileall -q model.py exporter.py example.py apps config tests launcher.py launcher_linux.py linux_graphics.py
          python -m unittest discover -s tests -v
      - name: Validar versao e tag antes dos builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ -n "$tag" ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo 'Formato esperado: v0.0.1' >&2
              exit 1
            fi
            test "$(cat VERSION)" = "${tag#v}"
            # Dispatch apenas para tags ainda nao publicadas.
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] &&
               gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag ja existe: rode o workflow a partir da tag." >&2
              exit 1
            fi
          fi
      - name: Validar JavaScript
        run: node --check apps/dfd/static/js/app.js

  windows:
    # Gera um .exe real no runner Windows, sem cross-compilacao.
    needs: testes
    runs-on: windows-latest
    env:
      PYTHONNOUSERSITE: '1'
      QT_API: pyqt5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Instalar Vela e toolchain Windows
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-user -r requirements-build.txt
      - name: Verificar Qt e testes
        run: |
          python -c "from PyQt5.QtWidgets import QApplication; from PyQt5.QtWebEngineWidgets import QWebEngineView; print('Qt OK')"
          python -m unittest discover -s tests -v
      - name: Preparar estaticos offline
        run: python manage.py collectstatic --no-tailwind
      - name: Compilar com PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name DFD-Studio `
            --add-data "apps;apps" `
            --add-data "config;config" `
            --add-data "assets;assets" `
            --add-data "staticfiles;staticfiles" `
            --add-data "VERSION;." `
            --collect-all vela `
            --collect-all PyQt5 `
            --collect-all webview `
            --collect-submodules vela `
            --hidden-import=webview.platforms.qt `
            --hidden-import=qtpy.QtWebEngineWidgets `
            --hidden-import=qtpy.QtWebEngineCore `
            --hidden-import=qtpy.QtWebChannel `
            --exclude-module=webview.platforms.winforms `
            --exclude-module=clr `
            --exclude-module=pythonnet `
            launcher.py
      - name: Copiar fontes e estaticos para a distribuicao
        shell: pwsh
        run: |
          # O Vela atual pode carregar templates e arquivos de caminhos normais.
          foreach ($name in @('apps', 'config', 'staticfiles', 'assets', 'VERSION')) {
            Copy-Item -Path $name -Destination "dist/DFD-Studio/$name" -Recurse -Force
          }
      - name: Smoke test Windows sem abrir GUI
        shell: pwsh
        run: |
          .\dist\DFD-Studio\DFD-Studio.exe --self-test
          if (-not (Test-Path 'dist/DFD-Studio/staticfiles/dfd/js/app.js')) { throw 'JS ausente' }
      - name: Empacotar pasta executavel
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $file = "DFD-Studio-Windows-x86_64-$env:PACKAGE_LABEL.zip"
          Compress-Archive -Path dist/DFD-Studio -DestinationPath "release/$file" -Force
          $hash = (Get-FileHash "release/$file" -Algorithm SHA256).Hash.ToLower()
          "$hash  $file" | Set-Content "release/$file.sha256" -Encoding ascii
      - name: Anexar executavel nos artifacts do workflow
        uses: actions/upload-artifact@v4
        with:
          name: DFD-Studio-Windows-${{ env.PACKAGE_LABEL }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux x86_64 - PyQt6
    needs: testes
    runs-on: ubuntu-22.04
    env:
      QT_API: pyqt6
      PYWEBVIEW_GUI: qt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-linux-qt6.txt
            requirements-linux-build.txt
      - name: Bibliotecas nativas Qt e WebEngine
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libopengl0 libnss3 libgbm1 \
            libdbus-1-3 libasound2 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 \
            libxcb-render-util0 libxcomposite1 libxdamage1 libxrandr2 libx11-xcb1 \
            libgl1-mesa-dri zip xvfb xauth
      - name: Instalar Vela, PyQt6 e PyInstaller
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-linux-build.txt
      - name: Verificar o backend PyQt6 WebEngine
        run: |
          python -c "import webview.platforms.qt as qt; assert qt._qt6 and qt.is_webengine, 'Qt6 nao carregou'; print('PyQt6 OK')"
      - name: Gerar estaticos offline
        run: python manage.py collectstatic --no-tailwind
      - name: Compilar com PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name DFD-Studio \
            --add-data "apps:apps" --add-data "config:config" \
            --add-data "assets:assets" --add-data "staticfiles:staticfiles" \
            --add-data "VERSION:." \
            --collect-all vela --collect-all webview --collect-all PyQt6 \
            --collect-submodules apps \
            --hidden-import webview.platforms.qt \
            --hidden-import qtpy.QtWebEngineWidgets \
            --hidden-import qtpy.QtWebEngineCore \
            --hidden-import qtpy.QtWebChannel \
            --exclude-module PyQt5 --exclude-module gi \
            launcher_linux.py
      - name: Copiar arquivos usados pelo Vela para pasta do aplicativo
        run: cp -a apps config assets staticfiles VERSION dist/DFD-Studio/
      - name: Smoke test do executavel Linux (sem interface grafica)
        run: |
          QT_QPA_PLATFORM=offscreen ./dist/DFD-Studio/DFD-Studio --self-test
          test -f dist/DFD-Studio/apps/dfd/templates/dfd/index.html
          test -f dist/DFD-Studio/staticfiles/dfd/js/app.js
          find dist/DFD-Studio -type f -name QtWebEngineProcess | grep -q .
      - name: Teste de abertura de janela (Xvfb, renderizacao por software)
        run: |
          set +e
          timeout --signal=TERM 20s xvfb-run -a ./dist/DFD-Studio/DFD-Studio > startup.log 2>&1
          code=$?
          set -e
          cat startup.log
          if [[ "$code" != 0 && "$code" != 124 ]]; then
            echo "Aplicativo encerrou inesperadamente (codigo=$code)" >&2
            exit 1
          fi
          grep -q 'Servidor HTTP pronto' startup.log
          if grep -q 'Could not initialize GLX' startup.log; then
            echo 'Falha de inicializacao GLX no teste com Xvfb' >&2
            exit 1
          fi
      - name: Empacotar Linux e gerar checksum SHA-256
        run: |
          mkdir -p release
          file="DFD-Studio-Linux-x86_64-$PACKAGE_LABEL.zip"
          (cd dist && zip -q -r "../release/$file" DFD-Studio)
          (cd release && sha256sum "$file" > "$file.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: DFD-Studio-Linux-${{ env.PACKAGE_LABEL }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar GitHub Release
    needs: [testes, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Criar ou atualizar release com os dois binarios
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release -maxdepth 1 -name '*.sha256' | wc -l)" -eq 2
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* -R "$GITHUB_REPOSITORY" --clobber
          else
            # A nova tag so nasce depois de todos os testes e builds passarem.
            gh release create "$RELEASE_TAG" release/* \
              -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "DFD Studio $RELEASE_TAG" --generate-notes
          fi
